# Reverse-proxy vhost for SATOM Builder -- a SAMPLE for review.
#
# The installer writes the real vhost with deploy/tls-bootstrap.sh write-vhost
# (the ONE author of it); this copy exists so the layout can be reviewed before
# running anything. Replace builder.example.com and the certificate paths.
#
# Rules that are not style (tests/test_tls_by_default.py holds every vhost to
# them):
#   * proxy_set_header Host $http_host -- never $host, which drops the port and
#     breaks the CSRF origin check behind a non-standard port;
#   * client_max_body_size >= every upload the app accepts (the 20 MB asset
#     limit) and >= the update-package ceiling (200 MB);
#   * the :80 redirect lives INSIDE location /, so the ACME http-01 challenge
#     location still answers;
#   * gunicorn is reached on loopback only.

server {
    listen 443 ssl http2;
    server_name builder.example.com;

    ssl_certificate     /etc/satom-builder/pki/public/server.crt;
    ssl_certificate_key /etc/satom-builder/pki/public/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 200M;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_hide_header Strict-Transport-Security;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name builder.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/satom-builder-acme;
        default_type "text/plain";
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
